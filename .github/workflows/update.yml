# 4× daily at 02:17, 08:17, 14:17, 20:17 KST: fetch the anonymized periods, rebuild data and pages, commit, deploy to Pages.
# On push (manual edits to text/template): rebuild pages and deploy without fetching.
# After deploy, changed pages are submitted to IndexNow (key file <key>.txt at the site root).
# Needs: repository secrets FPH_EXPORT_URL and FPH_TOKEN, and Settings → Pages → Source = "GitHub Actions".
name: Update

on:
  schedule:
    # 2h17m after each scan round (00·06·12·18 KST); off the hour to avoid queue delays
    - cron: '17 5,11,17,23 * * *'   # UTC → 14:17, 20:17, 02:17, 08:17 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and aggregate
        if: github.event_name != 'push'
        env:
          FPH_EXPORT_URL: ${{ secrets.FPH_EXPORT_URL }}
          FPH_TOKEN: ${{ secrets.FPH_TOKEN }}
        run: |
          node scripts/fetch.mjs
          node scripts/aggregate.mjs

      - name: Build pages
        run: node scripts/build.mjs

      - name: Commit
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q 'index.html          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
; then echo "pages=true" >> "$GITHUB_OUTPUT"; fi
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: steps.commit.outputs.pages == 'true' || github.event_name == 'push'
        continue-on-error: true
        run: |
          KEY=$(ls | grep -E '^[0-9a-f]{32}[.]txt$' | head -1 | sed 's/[.]txt$//')
          SITE=https://false-positive-heroes.github.io/
          URLS=$(printf '"%s",' "$SITE" "$SITE"{ko,zh,es,ar,pt,id,fr}/ | sed 's/,$//')
          BODY=$(printf '{"host":"false-positive-heroes.github.io","key":"%s","keyLocation":"%s%s.txt","urlList":[%s]}' "$KEY" "$SITE" "$KEY" "$URLS")
          echo "$BODY"
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
